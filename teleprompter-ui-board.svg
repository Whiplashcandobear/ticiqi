    <rect x="27" y="136" width="276" height="372" rx="16" fill="#ffffff" stroke="#dce6f2"/>
    <text x="45" y="174" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#14233d">Good morning, everyone.</text>
    <text x="45" y="210" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#14233d">Today, I would like to talk about</text>
