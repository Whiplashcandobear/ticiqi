    <text x="45" y="286" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#14233d">They may seem small, but over time,</text>
    <text x="45" y="310" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#14233d">they create meaningful change.</text>
    <text x="45" y="362" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#14233d">This idea is simple, but powerful.</text>
    <text x="45" y="414" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#14233d">One small action can start today.</text>
    <text x="45" y="478" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#71849c">1,024 words · 08:32 at 120 WPM</text>
